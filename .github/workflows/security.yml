# Security pipeline: lint → SAST (gosec + staticcheck) → dependency-scan (govulncheck)
# Any job failure blocks merge. SARIF uploaded to GitHub Security tab.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'   # every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --config=.golangci.yml

  sast:
    name: SAST
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run gosec
        shell: bash
        run: |
          set +e
          gosec -exclude=G101,G115,G118,G304,G306 -fmt sarif -out gosec-results.sarif ./...
          gosec_exit=$?
          if [[ ! -f gosec-results.sarif ]]; then
            echo "::error::gosec did not generate gosec-results.sarif (exit ${gosec_exit})"
            exit 1
          fi
          exit "$gosec_exit"

      - name: Run staticcheck
        if: always()
        run: staticcheck ./...

      - name: Upload gosec SARIF
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

  dependency-scan:
    name: Dependency scan
    needs: [sast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...
