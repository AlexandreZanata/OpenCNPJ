[workspace]
resolver = "3"
members = ["crates/opencnpj-core", "crates/opencnpj-store", "crates/opencnpj-ingest", "crates/opencnpj"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexandreZanata/OpenCNPJ"

[workspace.dependencies]
opencnpj-core = { path = "crates/opencnpj-core" }
opencnpj-store = { path = "crates/opencnpj-store" }
opencnpj-ingest = { path = "crates/opencnpj-ingest" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
fst = "0.4.7"
roaring = "0.11"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
axum = "0.8"
tower = { version = "0.5", features = ["limit", "timeout", "util", "load-shed"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tempfile = "3"
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
