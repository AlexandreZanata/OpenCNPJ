# /etc/sysctl.d/90-opencnpj.conf — many concurrent keep-alive connections.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_fin_timeout = 15
fs.file-max = 2097152
# Keep the snapshot's hot pages in memory rather than swapping.
vm.swappiness = 10
