[package]
name = "opencnpj"
description = "Compact offline search engine and HTTP API for Brazilian CNPJ open data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "opencnpj"

[dependencies]
opencnpj-core.workspace = true
opencnpj-store.workspace = true
opencnpj-ingest.workspace = true
opencnpj-insights.workspace = true
opencnpj-query.workspace = true
opencnpj-nlu.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
xxhash-rust.workspace = true
roaring.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
reqwest.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
zstd.workspace = true
libc = "0.2"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
moka = { version = "0.12", features = ["future", "sync"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "compression-zstd"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile.workspace = true
