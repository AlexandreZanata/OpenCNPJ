#           ("dentistas ativos em Cuiabá com telefone"): every one is read by a filter, a
#           period or the sentence structure. A noun phrase with any other word is not
#           executed as a search.
# [general] Further words of questions that state what they want ("quantas", "liste",
#           "compare"): request verbs, analysis terms, scenario phrases and regional
#           expressions. `corpus` holds the remaining words of executed evaluation questions
#           that carry no filter meaning; review it with `opencnpj-intel vocab`.
